name: Approve Perf Baseline

on:
  workflow_dispatch: {}

jobs:
  create-baseline-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate selected run and update both baseline records
        env:
          PERF_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run test:perf
          node scripts/approvePerfBaseline.js "baseline-$(date -u +%Y-%m-%d)-${PERF_RUN_ID}.json" "$PERF_RUN_ID"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(perf): approve fresh baseline'
          branch: perf/baseline-${{ github.run_id }}-${{ github.run_attempt }}
          add-paths: src/__tests__/performance/baselines/*.json
          title: 'perf(baseline): approve fresh run ${{ github.run_id }}'
          body: |
            Updates the timestamped baseline and last-baseline.json from a fresh benchmark
            on Node 22.18.0. The record includes workload, source digest, commit, run ID,
            timing samples and runner context. Review hardware comparability before merging.
