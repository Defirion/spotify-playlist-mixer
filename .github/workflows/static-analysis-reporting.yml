name: CI — tests + static analysis reports

on:
  push:
    branches: [main, master, final-refactor]
  pull_request:
    branches: [main, master, final-refactor]

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent

      - name: Run depcheck (report only)
        run: |
          npx depcheck --json > depcheck.json || true
          echo "Saved depcheck output to depcheck.json"

      - name: Run ts-prune (report only)
        run: |
          npx --no-install ts-prune > ts-prune.txt
          echo "Saved ts-prune output to ts-prune.txt"

      - name: Report application reachability separately from test consumers
        run: node scripts/report-reachability.js > production-reachability.json

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            depcheck.json
            ts-prune.txt
            production-reachability.json
